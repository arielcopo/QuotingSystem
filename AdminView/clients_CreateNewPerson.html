<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Client Modal</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        /* === Global Reset & Variables === */
        :root {
            --text-main: #171717;
            --text-sub: #404040;
            --text-light: #737373;
            --text-muted: #A3A3A3;
            --bg-body: #FFFFFF;
            --bg-gray: #FAFAFA;
            --border-light: #E5E5E5;
            --border-dark: #D4D4D4;
            --brand-yellow: #FFCC00;
            --brand-dark: #332900;
            --brand-red: #DC2626;
            --icon-gold: #CA8A04;
            --icon-bg-inner: #FEF9C3;
            --icon-bg-outer: #FEFCE8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Inter', sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden; /* Prevents background scrolling */
            background: #F3F4F6; /* Fallback background behind the overlay */
            -webkit-font-smoothing: antialiased;
        }

        /* === Modal Overlay === */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 10, 0.70);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        /* === Modal Container === */
        .modal-box {
            background: var(--bg-body);
            width: 100%;
            max-width: 568px;
            border-radius: 12px;
            box-shadow: 0px 20px 24px -4px rgba(0, 0, 0, 0.08), 0px 8px 8px -4px rgba(0, 0, 0, 0.03);
            padding: 24px;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            overflow-y: auto; /* Allows scrolling inside modal if screen is very small */
        }

        /* Hide scrollbar for cleaner UI */
        .modal-box::-webkit-scrollbar { width: 0px; }

        /* === Header === */
        .modal-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .icon-wrapper {
            width: 48px;
            height: 48px;
            background: var(--icon-bg-inner);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 0 6px var(--icon-bg-outer);
            color: var(--icon-gold);
            font-size: 24px;
        }

        .modal-title {
            color: var(--text-main);
            font-size: 18px;
            font-weight: 600;
            line-height: 28px;
        }

        /* === Company Section === */
        .company-section {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            margin-bottom: 24px;
        }

        .or-text {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
            padding-bottom: 10px; /* Aligns visually with inputs */
        }

        /* === Divider === */
        .divider {
            border: none;
            border-top: 1px solid var(--border-light);
            margin-bottom: 24px;
        }

        /* === Form Elements === */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .input-label {
            color: var(--text-sub);
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .input-field {
            width: 100%;
            height: 38px;
            padding: 10px 14px;
            background: var(--bg-body);
            border: 1px solid var(--border-dark);
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-main);
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-field:focus {
            border-color: var(--text-muted);
        }

        .input-field::placeholder {
            color: var(--text-light);
        }

        .input-field.error {
            border-color: var(--brand-red);
        }

        .error-msg {
            display: none;
            position: absolute;
            top: calc(100% + 0px);
            left: 0;
            color: var(--brand-red);
            font-size: 11px;
            font-weight: 500;
        }

        /* === Custom Dropdown === */
        .custom-select {
            position: relative;
            width: 100%;
        }

        .select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .select-trigger i {
            color: var(--text-light);
            font-size: 16px;
        }

        .select-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            background: var(--bg-body);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            box-shadow: 0px 12px 16px -4px rgba(0, 0, 0, 0.08);
            z-index: 10;
            overflow: hidden;
            padding: 4px 0;
        }

        .select-dropdown.show {
            display: block;
        }

        .select-option {
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .select-option:hover {
            background: var(--bg-gray);
        }

        .select-option.active {
            background: var(--bg-gray);
        }

        .select-option.active i {
            color: var(--text-sub);
            font-size: 16px;
            display: block;
        }

        .select-option i {
            display: none;
        }

        /* === Actions / Footer === */
        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            height: 44px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.05);
            border: none;
            font-family: inherit;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-cancel {
            background: var(--bg-body);
            border: 1px solid var(--border-dark);
            color: var(--text-sub);
        }

        .btn-primary {
            background: var(--brand-yellow);
            color: var(--brand-dark);
        }

        /* Responsive Breakpoints */
        @media (max-width: 500px) {
            .company-section {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            .input-group {
                width: 100%;
            }
            .or-text {
                padding-bottom: 0;
            }
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- Full Screen Overlay -->
<div class="modal-overlay">
    
    <!-- Modal Content -->
    <div class="modal-box">
        
        <!-- Header -->
        <div class="modal-header">
            <div class="icon-wrapper">
                <i class="ph ph-user-plus"></i>
            </div>
            <h2 class="modal-title">Create New Client</h2>
        </div>

        <!-- Company Selection Area -->
        <div class="company-section">
            
            <div class="input-group">
                <label class="input-label">Existing Company</label>
                <div class="custom-select" id="companySelect">
                    <div class="input-field select-trigger" onclick="toggleDropdown()">
                        <span id="selectedCompany">Active Waterproofing Pty Ltd</span>
                        <i class="ph ph-caret-down"></i>
                    </div>
                    
                    <div class="select-dropdown" id="companyDropdown">
                        <div class="select-option active" onclick="selectCompany(this, 'Active Waterproofing Pty Ltd')">
                            Active Waterproofing Pty Ltd <i class="ph ph-check"></i>
                        </div>
                        <div class="select-option" onclick="selectCompany(this, 'ADAPT Gym')">
                            ADAPT Gym <i class="ph ph-check"></i>
                        </div>
                        <div class="select-option" onclick="selectCompany(this, 'Adelaide Film Festival')">
                            Adelaide Film Festival <i class="ph ph-check"></i>
                        </div>
                        <div class="select-option" onclick="selectCompany(this, 'Adenbrook Homes')">
                            Adenbrook Homes <i class="ph ph-check"></i>
                        </div>
                        <div class="select-option" onclick="selectCompany(this, 'Aeramix')">
                            Aeramix <i class="ph ph-check"></i>
                        </div>
                    </div>
                </div>
            </div>

            <span class="or-text">OR</span>

            <div class="input-group">
                <label class="input-label">Create a New Company Name</label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" placeholder="New Client Company">
                </div>
            </div>

        </div>

        <hr class="divider">

        <!-- Form Grid -->
        <div class="form-grid">
            
            <div class="input-group">
                <label class="input-label">First Name</label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" placeholder="John">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Last Name</label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" placeholder="Doe">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Title</label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" placeholder="Mr. / Ms.">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Job Title</label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" placeholder="Manager">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Email</label>
                <div class="input-wrapper">
                    <input type="email" class="input-field" id="emailInput" placeholder="johndoe@gmail.com">
                    <span class="error-msg" id="emailError">Please enter a valid email address.</span>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Phone</label>
                <div class="input-wrapper">
                    <input type="tel" class="input-field" placeholder="1800 000 000">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Website</label>
                <div class="input-wrapper">
                    <input type="url" class="input-field" placeholder="www.johndoe.com.au">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Address</label>
                <div class="input-wrapper">
                    <input type="text" class="input-field" placeholder="Brisbane AU">
                </div>
            </div>

        </div>

        <!-- Actions -->
        <div class="modal-actions">
            <button class="btn btn-cancel">Cancel</button>
            <button class="btn btn-primary" onclick="validateForm()">Create Client</button>
        </div>

    </div>
</div>

<script>
    // --- Dropdown Logic ---
    function toggleDropdown() {
        const dropdown = document.getElementById('companyDropdown');
        dropdown.classList.toggle('show');
    }

    function selectCompany(element, companyName) {
        // Update Trigger Text
        document.getElementById('selectedCompany').innerText = companyName;
        
        // Remove active class from all options
        const options = document.querySelectorAll('.select-option');
        options.forEach(opt => opt.classList.remove('active'));
        
        // Add active class to clicked option
        element.classList.add('active');
        
        // Hide dropdown
        document.getElementById('companyDropdown').classList.remove('show');
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        const selectContainer = document.getElementById('companySelect');
        if (!selectContainer.contains(event.target)) {
            document.getElementById('companyDropdown').classList.remove('show');
        }
    });

    // --- Email Validation Logic ---
    const emailInput = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');

    // Simple Regex for email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function validateEmail() {
        const emailValue = emailInput.value.trim();
        
        // Only validate if not empty, or handle empty based on your required rules
        if (emailValue !== "" && !emailRegex.test(emailValue)) {
            emailInput.classList.add('error');
            emailError.style.display = 'block';
            return false;
        } else {
            emailInput.classList.remove('error');
            emailError.style.display = 'none';
            return true;
        }
    }

    // Trigger validation on blur (when user leaves the input)
    emailInput.addEventListener('blur', validateEmail);

    // Optional: Re-validate immediately as they type if it's already showing an error
    emailInput.addEventListener('input', () => {
        if (emailInput.classList.contains('error')) {
            validateEmail();
        }
    });

    // Validation Check on Form Submission (Clicking Create Client)
    function validateForm() {
        const isEmailValid = validateEmail();
        
        if (isEmailValid) {
            // Proceed with form submission / logic here
            alert("Form is valid. Client created!");
        } else {
            // Form is invalid
            emailInput.focus();
        }
    }
</script>

</body>
</html>
